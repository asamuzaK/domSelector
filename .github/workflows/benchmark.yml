name: benchmark
permissions:
  contents: read

on:
  release:
    types: [ created ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js lts/*
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
      - run: npm ci
      - run: npm run bench
